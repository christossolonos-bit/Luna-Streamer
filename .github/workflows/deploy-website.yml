name: Deploy website to GitHub Pages

on:
  push:
    branches: [main, master]
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install and build
        working-directory: website
        env:
          VITE_BASE_PATH: /Luna-Streamer/
          VITE_YOUTUBE_CHANNEL_URL: https://www.youtube.com/@lunawolfsolo
          VITE_YOUTUBE_CHANNEL_HANDLE: "@lunawolfsolo"
          VITE_YOUTUBE_CHANNEL_TITLE: Luna wolf
        run: |
          npm ci
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
