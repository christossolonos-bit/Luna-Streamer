name: Deploy website to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Refresh YouTube video list
        run: python scripts/fetch_youtube_videos.py

      - name: Install and build
        working-directory: website
        env:
          VITE_BASE_PATH: /Luna-Streamer/
          VITE_YOUTUBE_CHANNEL_URL: https://www.youtube.com/@lunawolfsolo
          VITE_YOUTUBE_CHANNEL_HANDLE: "@lunawolfsolo"
          VITE_YOUTUBE_CHANNEL_TITLE: Luna wolf
          VITE_DISCORD_INVITE_URL: https://discord.gg/t3DpY3EP
          VITE_DISCORD_SERVER_NAME: Luna's Wolf Den
        run: |
          npm ci
          npm run build

      - name: Upload Pages artifact (GitHub Actions source)
        uses: actions/upload-pages-artifact@v3
        with:
          path: website/dist

      - name: Publish to gh-pages branch (branch source fallback)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: website/dist
          force_orphan: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
